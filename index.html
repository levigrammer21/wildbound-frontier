<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142321">
  <meta name="description" content="Explore Alderwatch on foot in a persistent top-down fantasy RPG.">
  <title>Cairn &amp; Crown</title>
  <link rel="icon" type="image/svg+xml" href="./img/cairn.svg?v=1.1.0">
  <link rel="stylesheet" href="./style.css?v=1.1.0">
  <link rel="stylesheet" href="./field.css?v=1.1.0">
  <script type="module" src="./game.js?v=1.1.0"></script>
</head>
<body>
  <header class="mast">
    <div class="frame mast-row">
      <a href="#field" class="logo" aria-label="Cairn and Crown home"><img src="./img/cairn.svg?v=1.1.0" alt="" width="36" height="36"><span>CAIRN <i>&amp;</i> CROWN<small>THE ALDERWATCH VALLEY</small></span></a>
      <div class="top-right"><span id="version"></span><button type="button" class="button secondary" id="account-open">Sign in</button></div>
    </div>
  </header>
  <div id="status" class="notice" role="status" aria-live="polite" hidden></div>
  <section id="gate" class="frame" aria-label="Enter Alderwatch">
    <div class="welcome">
      <img src="./img/eldervale.webp" alt="" fetchpriority="high">
      <div class="welcome-content">
        <h1>Cairn &amp;<br>Crown</h1>
        <p>Explore Alderwatch on foot, follow its wild trails, and make your trade in a shared fantasy world.</p>
        <button id="welcome-action" class="button primary" type="button">Enter Alderwatch</button>
        <p id="gate-note" class="feedback" role="status"></p>
      </div>
    </div>
  </section>
  <main class="field-layout" id="world-layout" hidden>
    <div id="field-mount"></div>
    <section id="field-overlay" class="field-overlay" aria-labelledby="panel-title" hidden>
      <header class="field-overlay-head"><h2 id="panel-title"></h2><button id="panel-close" class="icon-btn" type="button" aria-label="Return to the world">×</button></header>
      <div id="game-content" class="field-overlay-body"></div>
    </section>
  </main>
  <nav class="nav field-nav" id="nav" aria-label="Game" hidden>
    <div class="frame nav-row">
      <a href="#field" data-nav="field"><span aria-hidden="true">⌾</span>Explore</a>
      <a href="#atlas" data-nav="atlas"><span aria-hidden="true">⌖</span>Atlas</a>
      <a href="#skills" data-nav="skills"><span aria-hidden="true">⚒</span>Skills</a>
      <a href="#pack" data-nav="pack"><span aria-hidden="true">◇</span>Pack</a>
    </div>
  </nav>
  <dialog id="modal" aria-labelledby="modal-title">
    <div class="dialog-head"><h2 id="modal-title"></h2><button id="modal-close" class="icon-btn" type="button" aria-label="Close">×</button></div>
    <div id="modal-body"></div>
  </dialog>
</body>
</html>
