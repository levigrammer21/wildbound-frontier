<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142321">
  <meta name="description" content="A private fantasy RPG in the valley of Alderwatch.">
  <title>Cairn &amp; Crown</title>
  <link rel="icon" type="image/svg+xml" href="./img/cairn.svg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.js"></script>
</head>
<body>
  <header class="mast">
    <div class="frame mast-row">
      <a href="#map" class="logo" aria-label="Cairn and Crown home"><img src="./img/cairn.svg" alt="" width="36" height="36"><span>CAIRN <i>&amp;</i> CROWN<small>THE ALDERWATCH VALLEY</small></span></a>
      <div class="top-right"><span id="version"></span><button type="button" class="button secondary" id="account-open">Sign in</button></div>
    </div>
  </header>
  <div id="status" class="notice" role="status" aria-live="polite" hidden></div>
  <section id="gate" class="frame" aria-label="Enter Alderwatch">
    <div class="welcome">
      <img src="./img/eldervale.webp" alt="" fetchpriority="high">
      <div class="welcome-content">
        <p class="eyebrow">A private fantasy RPG</p>
        <h1>Cairn &amp;<br>Crown</h1>
        <p>Follow the old roads of Alderwatch. Master your craft, earn your place in town, and see what stirs beyond the cairns.</p>
        <button id="welcome-action" class="button primary" type="button">Enter Alderwatch</button>
        <p id="gate-note" class="feedback" role="status"></p>
      </div>
    </div>
  </section>
  <div class="frame world-layout" id="world-layout" hidden>
    <aside class="side" id="rail" aria-label="Character status"></aside>
    <main id="game-content" tabindex="-1"></main>
  </div>
  <nav class="nav" id="nav" aria-label="Game" hidden>
    <div class="frame nav-row">
      <a href="#map" data-nav="map"><span aria-hidden="true">⌖</span>Map</a>
      <a href="#skills" data-nav="skills"><span aria-hidden="true">⚒</span>Skills</a>
      <a href="#pack" data-nav="pack"><span aria-hidden="true">◇</span>Pack</a>
      <a href="#town" data-nav="town"><span aria-hidden="true">♜</span>Town</a>
      <a href="#house" data-nav="house"><span aria-hidden="true">⌂</span>House</a>
    </div>
  </nav>
  <dialog id="modal" aria-labelledby="modal-title">
    <div class="dialog-head"><h2 id="modal-title"></h2><button id="modal-close" class="icon-btn" type="button" aria-label="Close">×</button></div>
    <div id="modal-body"></div>
  </dialog>
  <dialog id="battle" aria-labelledby="battle-title">
    <div class="dialog-head">
      <div><p class="eyebrow">Encounter</p><h2 id="battle-title"></h2></div>
      <button id="retreat" class="button secondary" type="button">Retreat</button>
    </div>
    <div id="battle-stage">
      <div id="combat-bars"></div>
      <div id="arena" aria-label="Five combat lanes"></div>
      <p id="combat-effect" aria-live="off"></p>
    </div>
    <div class="combat-hint" id="combat-hint" role="status"></div>
    <div id="combat-controls"></div>
    <div id="combat-result" hidden></div>
  </dialog>
</body>
</html>
